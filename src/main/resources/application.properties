spring.application.name=backend
# Google OAuth (rellena con tus valores o usa env vars)
google.oauth.clientId=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.clientSecret=${GOOGLE_OAUTH_CLIENT_SECRET:}
# Para SPA recomendamos usar "postmessage" como redirect URI cuando Google devuelve code a frontend
google.oauth.redirectUri=${GOOGLE_OAUTH_REDIRECT_URI:postmessage}

# URL del frontend (para CORS)
app.frontend.origin=https://frontend-downloader.vercel.app

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/music_downloader}
spring.datasource.username=${DATABASE_USERNAME:app}
spring.datasource.password=${DATABASE_PASSWORD:app123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Python API
python.api.url=${PYTHON_API_URL:http://localhost:8000}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:40434563354a586e3272357538782f413442a46269404937244c635166546a576e5a7134743777217a25432646294a404e635266556a586e327235753878}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:music-downloader-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.principal.backend.domain.event
spring.kafka.producer.properties.spring.json.trusted.packages=com.principal.backend.domain.event
